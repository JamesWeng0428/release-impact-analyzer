name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DRIA_WARNINGS_AS_ERRORS=ON
          -DRIA_SANITIZE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: pip install -r requirements-dev.txt
      - name: Build native search bindings
        run: >
          cmake -S . -B build-py
          -DCMAKE_BUILD_TYPE=Release
          -DRIA_BUILD_TESTS=OFF -DRIA_BUILD_PYTHON=ON
          -DPython_EXECUTABLE="$(which python)"
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - name: Compile search bindings
        run: cmake --build build-py
      - name: Test crawler, analysis, search and evaluation (no network)
        env:
          PYTHONPATH: build-py
        run: python -m pytest -q crawler analysis retrieval evaluation
      - name: Exercise offline evaluation CLI
        env:
          PYTHONPATH: build-py
        run: |
          python -m evaluation.retrieval prepare --reviews examples/retrieval_reviews.jsonl --queries examples/retrieval_queries.jsonl --out build-py/evaluation-example
          python -m evaluation.retrieval score --workspace build-py/evaluation-example --judgments examples/retrieval_judgments.csv --split all --report build-py/example-report.json
